<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rush E - Меню</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #121214;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .screen {
            text-align: center;
            background: #1a1a1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .hidden { display: none !important; }
        .btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn:hover { background: #ff1e27; }
        .song-item {
            background: #2a2a30;
            padding: 15px;
            margin-top: 15px;
            border-radius: 6px;
            cursor: pointer;
        }
        .song-item:hover { background: #3a3a42; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="screen">
        <h1>🎹 PIANO GAME</h1>
        <button id="play-btn" class="btn">ИГРАТЬ</button>
    </div>

    <!-- ЭКРАН 2: ВЫБОР ПЕСЕН -->
    <div id="song-menu" class="screen hidden">
        <h2>Выберите песню</h2>
        <!-- При клике вызывается функция из внешнего файла script.js -->
        <div class="song-item" onclick="startRushE()">🎵 Запустить RUSH E</div>
    </div>

    <!-- ПОДКЛЮЧАЕМ НАШ ВТОРОЙ ФАЙЛ С МУЗЫКОЙ -->
    <script src="script.js"></script>

    <script>
        // Логика кнопок меню (остается здесь)
        const mainMenu = document.getElementById('main-menu');
        const songMenu = document.getElementById('song-menu');
        const playBtn = document.getElementById('play-btn');

        playBtn.addEventListener('click', () => {
            mainMenu.classList.add('hidden');
            songMenu.classList.remove('hidden');
        });
    </script>
</body>
</html>
