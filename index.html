<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё Пианино</title>
    <style>
        /* Общие стили для красивого фона */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #0f0f1a);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Контейнер для экранов */
        .screen {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 60px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        /* Класс для скрытия неактивных экранов */
        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Стили кнопок */
        .btn {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* Стили для списка песен */
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .song-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            border: 1px solid transparent;
        }

        .song-item:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00c6ff;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="screen">
        <h1>🎹 PIANO GAME</h1>
        <button id="play-btn" class="btn">ИГРАТЬ</button>
    </div>

    <!-- ЭКРАН 2: ВЫБОР ПЕСЕН (Изначально скрыт) -->
    <div id="song-menu" class="screen hidden">
        <h1>Выберите песню</h1>
        
        <div class="song-list">
            <!-- Пока просто заглушки, логику выбора сделаем позже -->
            <div class="song-item" onclick="selectSong(1)">🎵 Моя Песня 1 (Кастомная)</div>
            <div class="song-item" onclick="selectSong(2)">🎵 Моя Песня 2 (Рок-н-ролл)</div>
            <div class="song-item" onclick="selectSong(3)">🎵 Моя Песня 3 (Мелодия)</div>
        </div>
    </div>

    <script>
        // Находим элементы меню в коде
        const mainMenu = document.getElementById('main-menu');
        const songMenu = document.getElementById('song-menu');
        const playBtn = document.getElementById('play-btn');

        // Обработчик нажатия на кнопку "ИГРАТЬ"
        playBtn.addEventListener('click', () => {
            mainMenu.classList.add('hidden'); // Скрываем главное меню
            songMenu.classList.remove('hidden'); // Показываем меню песен
        });

        // Функция, которая сработает при клике на песню (для будущего файла)
        function selectSong(songId) {
            alert('Вы выбрали песню №' + songId + '. Скоро здесь будет запускаться игра!');
        }
    </script>
</body>
</html>
